# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: avatar-ip
metadata:
    template: azd-init@1.20.3
services:
    backend:
        project: voicelive-api-salescoach/backend
        host: containerapp
        language: python
        docker:
            path: Dockerfile
    frontend:
        project: voicelive-api-salescoach/frontend
        host: containerapp
        language: ts
        dist: dist
resources:
    backend:
        type: host.containerapp
        port: 8000
    frontend:
        type: host.containerapp
        uses:
            - backend
        port: 80
